<html>
<head>
<title>MERIII JAAAN KA PHOTU</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background-image: url("./img/—Pngtree—cake couture designing edible art_15691390.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }
   #musicButton {
        background: linear-gradient(135deg, #ff4f9a, #ff1493);
        color: white;
        font-size: 24px;
        font-weight: bold;
        padding: 22px 45px;
        border: 3px solid white;
        border-radius: 20px;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(255, 20, 147, 0.4);
        margin: 25px auto;
        display: block;
        transition: 0.3s;
    }
    #musicButton:hover {
        transform: scale(1.08);
        background: linear-gradient(135deg, #ff1493, #ff69b4);
    }
</style>
</head>
<body>
       <h1 style="color:red ; text-align:center"> MELLLIIIII PAYAAAALIII BAABUU KA PHOTUUUUU! <br>
                                ONCEEE AGAIN HAPPYYYYYYY BIRHTDAAYYY TOOO YOUUUU!<BR>
                  I LOVEEE YOUUUUUUUUUU! </h1>
  <audio id="music" loop>
    <source src="./audio/tu-sanwal-phul-kasturi-song--instagram-trending-song-2026.mp3" type="mpeg">
</audio>
<button id="musicButton" onclick="toggleMusic()">
    🎵 Play Music ❤️
</button>
<script>
    const music = document.getElementById("music");
    const musicButton = document.getElementById("musicButton");

    function toggleMusic() {
        if (music.paused) {
            music.play().then(() => {
                musicButton.innerHTML = "⏸ Pause Music ❤️";
            }).catch(error => {
                alert("Music could not play. Please try again!");
            });
        } else {
            music.pause();
            musicButton.innerHTML = "🎵 Play Music ❤️";
        }
    }

    music.addEventListener("ended", () => {
        musicButton.innerHTML = "🎵 Play Music ❤️";
    });
</script>
